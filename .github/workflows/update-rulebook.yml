name: Update Rulebook

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ vars.USPA_RULEBOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check official Rulebook
        env:
          USPA_RULEBOOK_URL: ${{ vars.USPA_RULEBOOK_URL }}
        run: python scripts/check_rulebook.py
      - name: Commit changed rules
        run: |
          if git diff --quiet; then
            echo "No Rulebook changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: update USPA Rulebook dataset"
          git push
