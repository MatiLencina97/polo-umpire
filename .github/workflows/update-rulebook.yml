name: Check USPA Rulebook

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check official Rulebook and regenerate dataset
        env:
          USPA_RULEBOOK_URL: ${{ vars.USPA_RULEBOOK_URL }}
        run: python scripts/check_rulebook.py
      - name: Commit Rulebook update
        run: |
          if git diff --quiet; then
            echo "No Rulebook changes."
            exit 0
          fi
          git config user.name "rulebook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/
          git commit -m "chore: update USPA rulebook dataset"
          git push
