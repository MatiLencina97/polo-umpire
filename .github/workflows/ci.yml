name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Emit generated lockfile for v0.26 bootstrap
        run: echo "LOCKFILE_B64=$(base64 -w0 package-lock.json)"
      - run: npm run test:rules
      - run: npm run build
